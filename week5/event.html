<!DOCTYPE html>
<html lang="en">
<head>
    <title>Event Handling</title>
    <style>
        body {
            width: 320px;
            margin: 40px auto;
            font-family: Arial, sans-serif;
        }

        .box {
            border: 2px solid #444;
            padding: 20px;
            margin: 10px 0;
            cursor: pointer;
            text-align: center;
        }

        .clicked {
            background: lightgreen;
        }

        .hovered {
            background: yellow;
        }

        #eventLog {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <h1>Event Handling for Automation</h1>

    <div id="clickBox" class="box">Click me</div>

    <div id="hoverBox" class="box">Hover over me</div>
    <div id="dblBox" class="box">Double click me</div> 

    <button id="resetBtn">Reset</button>

    <button id="simulateBtn">Simulate</button>

    <div id="eventLog"></div>

    <script src="day25event.js"></script>

</body>
</html>
